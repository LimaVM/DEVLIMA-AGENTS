name: ${COMPOSE_PROJECT_NAME:-devlima-agent}

x-backend: &backend
  image: devlima-agent-backend:phase1
  build:
    context: ../backend
    target: production
  environment: &backend-env
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-devlima_agent}
    POSTGRES_USER: ${POSTGRES_USER:-agent}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Gere .env com scripts/init_env.py}
    JWT_SECRET: ${JWT_SECRET:?Gere .env com scripts/init_env.py}
    JWT_ISSUER: ${JWT_ISSUER:-devlima-agent}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-devlima-android}
    JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-30}
    DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
    ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
    LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
  networks: [database]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 100

services:
  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devlima_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Gere .env}
      TZ: UTC
      PGTZ: UTC
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 100
    security_opt: [no-new-privileges:true]

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    <<: *backend
    restart: unless-stopped
    networks: [database, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=5)']
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:-localhost}
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${CADDY_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile.private}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt: [no-new-privileges:true]

  postgres-test:
    profiles: [test]
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: devlima_agent_test
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Gere .env}
      TZ: UTC
      PGTZ: UTC
    tmpfs: [/var/lib/postgresql/data]
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d devlima_agent_test']
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0

  migrate-test:
    <<: *backend
    profiles: [test]
    environment:
      <<: *backend-env
      POSTGRES_HOST: postgres-test
      POSTGRES_DB: devlima_agent_test
    networks: [test]
    command: [alembic, upgrade, head]
    depends_on:
      postgres-test: {condition: service_healthy}

  tests:
    <<: *backend
    profiles: [test]
    image: devlima-agent-tests:phase1
    build:
      context: ../backend
      target: test
    environment:
      <<: *backend-env
      POSTGRES_HOST: postgres-test
      POSTGRES_DB: devlima_agent_test
    networks: [test]
    depends_on:
      migrate-test: {condition: service_completed_successfully}

networks:
  database: {internal: true}
  edge: {}
  test: {internal: true}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
